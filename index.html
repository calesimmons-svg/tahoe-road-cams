<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahoe Road Cams v24</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="favicon-256.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #stage{position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{flex:1;min-height:0;display:flex}
  #mapbox{position:relative;flex:1;min-width:0;min-height:0;background:#0d1117}
  #bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:800}
  #side{flex:none;position:relative;z-index:700;background:#0d1117;width:clamp(300px,27vw,410px);overflow-y:auto;padding:10px 10px 6px 8px;font-size:13px}
  #side::-webkit-scrollbar{width:8px}#side::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
  .box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:9px 10px;margin-bottom:8px}
  .box h3{margin:0 0 7px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#c9d1d9;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .box h3 small{font-size:10.5px;text-transform:none;letter-spacing:0;color:#8b949e;font-weight:400}
  .note{font-size:11px;color:#8b949e;margin:6px 0 0}
  .muted{color:#8b949e}
  .alert{background:#3b1d1d;border:1px solid #f85149;color:#ffdcd7;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12.5px}
  .alert b{color:#fff}
  .ok{background:#12261a;border:1px solid #238636;color:#aff5b4;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:12px}
  .loc{padding:6px 0;border-top:1px solid #21262d}
  .loc:first-child{border-top:0;padding-top:0}
  .lh{display:flex;align-items:baseline;gap:6px;justify-content:space-between}
  .lh b{font-size:13px}
  .chip{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;color:#0d1117;white-space:nowrap}
  .mets{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:3px 0 4px;color:#c9d1d9}
  .strip24{display:flex;align-items:flex-end;gap:1px;height:34px;background:#0d1117;border-radius:4px;padding:2px}
  .strip24 i{flex:1;min-height:2px;border-radius:1px;display:block}
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:#6e7681;margin-top:1px}
  .legend{display:flex;gap:10px;font-size:10.5px;color:#8b949e;margin-top:5px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
  table.t{width:100%;border-collapse:collapse;font-size:12px}
  table.t td{padding:3px 4px 3px 0;vertical-align:top;border-top:1px solid #21262d}
  table.t tr:first-child td{border-top:0}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;color:#fff}
  .links{display:flex;flex-direction:column;gap:6px}
  .links a{display:block;background:#21262d;border:1px solid #30363d;border-radius:8px;padding:7px 10px;color:#58a6ff;text-decoration:none;font-weight:600;font-size:12.5px}
  .links a:hover{background:#30363d}

  #mapimg{border-radius:10px;overflow:visible}
  #mapimg img{width:100%;height:100%;display:block;border-radius:10px;user-select:none;-webkit-user-drag:none}
  #lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:650}
  #strip{flex:none;height:31vh;min-height:170px;padding:0 10px 10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;position:relative;z-index:700}
  .card{min-height:0;display:flex;flex-direction:column;background:rgba(13,17,23,.96);border:2px solid var(--c);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .card header{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:13px;font-weight:600;white-space:nowrap}
  .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  .nm{overflow:hidden;text-overflow:ellipsis}
  .st{margin-left:auto;font-size:11px;font-weight:500;color:#8b949e}
  .st.bad{color:#ff7b72}
  .imgwrap{flex:1;min-height:0;background:#000;display:grid;place-items:center;cursor:zoom-in}
  .imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
  #bar{display:flex;align-items:center;gap:10px;background:rgba(13,17,23,.92);border:1px solid #30363d;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
  #bar button{background:#238636;color:#fff;border:0;border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer}
  #bar .ver{font-size:11px;color:#8b949e;font-weight:500}
  .pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--c);color:#fff;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:5}
  .lbl{position:absolute;white-space:nowrap;background:rgba(13,17,23,.92);border:1px solid var(--c);color:#fff;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;pointer-events:none}
  .lbl.r{left:34px;top:50%;transform:translateY(-50%)}
  .lbl.l{right:34px;top:50%;transform:translateY(-50%)}
  .lbl.t{bottom:34px;left:50%;transform:translateX(-50%)}
  .lbl.b{top:34px;left:50%;transform:translateX(-50%)}
  #drive{position:absolute;top:10px;left:10px;z-index:800;width:304px;background:rgba(13,17,23,.94);border:1px solid #30363d;border-radius:12px;padding:9px 10px 10px}
  #drive .rt{font-size:11.5px;color:#8b949e;line-height:1.35}
  #drive .rt b{color:#e6edf3}
  #drive .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  #swap{flex:none;background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:8px;width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer}
  #swap:hover{background:#30363d}
  .dc{display:flex;gap:9px;align-items:flex-start;margin-top:7px;padding:8px 9px;background:#161b22;border:1px solid #30363d;border-left:4px solid var(--c);border-radius:8px;color:#e6edf3;text-decoration:none}
  .dc:hover{background:#1c2330}
  .dc .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--c);display:grid;place-items:center}
  .dc .mid{flex:1;min-width:0}
  .dc .app{font-size:10.5px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:5px}
  .dc .car{width:13px;height:13px;fill:#8b949e}
  .dc .rn{font-size:13px;font-weight:600;line-height:1.25;margin-top:1px}
  .dc .nt{font-size:11.5px;color:#8b949e;line-height:1.3;margin-top:1px}
  .dc .asof{font-size:10px;color:#6e7681;margin-top:3px}
  .dc .asof.old{color:#d29922}
  .dc .rg{flex:none;text-align:right}
  .dc .tm{font-size:17px;font-weight:700;color:#56d364;white-space:nowrap;line-height:1.1}
  .dc .mi{font-size:11.5px;color:#8b949e;margin-top:3px;white-space:nowrap}
  #gl{position:absolute;inset:0;display:none}
  .pin.live{margin:0}
  #mapctl{position:absolute;left:10px;bottom:36px;z-index:800;display:none;flex-direction:column;gap:6px;align-items:flex-start}
  #mapctl.on{display:flex}
  #mapctl .row{display:flex;gap:4px;background:rgba(13,17,23,.92);border:1px solid #30363d;border-radius:999px;padding:3px}
  #mapctl button{background:transparent;color:#c9d1d9;border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
  #mapctl button.on{background:#238636;color:#fff}
  #mapctl .leg{display:flex;gap:9px;align-items:center;background:rgba(13,17,23,.92);border:1px solid #30363d;border-radius:999px;padding:3px 10px;font-size:11px;color:#c9d1d9}
  #mapctl .leg i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
  #tokbox{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:820;width:min(560px,92%);background:rgba(13,17,23,.96);border:1px solid #30363d;border-radius:12px;padding:10px 12px;font-size:12.5px;display:none}
  #tokbox.on{display:block}
  #tokbox .tr{display:flex;gap:6px;margin-top:6px}
  #tokbox input{flex:1;min-width:0;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;padding:6px 8px;font-size:12.5px}
  #tokbox button{background:#238636;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
  #tokbox a{color:#58a6ff}
  #tokbox .err{color:#ff7b72;margin-top:5px}
  #drive .alt{font-size:11.5px;color:#8b949e;margin:5px 2px 0;line-height:1.3}
  #drive .alt b{color:#c9d1d9;font-weight:600}
  #drive .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  #drive .apps a{display:flex;align-items:center;justify-content:center;gap:6px;background:#21262d;border:1px solid #30363d;border-radius:8px;padding:6px 4px;color:#e6edf3;text-decoration:none;font-weight:600;font-size:11.5px}
  #drive .apps a:hover{background:#30363d}
  #drive .apps .ai{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:none}
  #drive .apps .ai svg{width:12px;height:12px}
  #drive .apsub{font-size:10px;color:#6e7681;margin:4px 2px 0}
  #radarbtn{position:absolute;left:10px;bottom:34px;z-index:800;display:none;align-items:center;gap:7px;background:rgba(13,17,23,.92);border:1px solid #30363d;border-radius:999px;padding:5px 12px;color:#c9d1d9;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  #radarbtn.show{display:flex}
  #radarbtn .dot{width:9px;height:9px;border-radius:50%;background:#30363d;flex:none}
  #radarbtn.on .dot{background:#58a6ff;box-shadow:0 0 6px #58a6ff}
  #radarbtn small{font-weight:400;color:#8b949e}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;display:none;place-items:center;flex-direction:column;gap:8px;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:94vw;max-height:88vh;object-fit:contain}
  #lightbox div{font-size:15px}
  @media (max-width:820px){
    #stage{height:auto;overflow:visible;display:block}
    .top{display:block}
    #mapbox{padding:52px 8px 0}
    #gl{position:relative !important;inset:auto;height:62vh;border-radius:10px;overflow:hidden}
    #radarbtn{bottom:auto;top:62px}
    #drive{position:static;width:auto;margin:0 8px 8px}
    #side{width:auto;padding:8px 8px 0;overflow:visible;background:none}
    #lines{display:none}
    #mapimg img{height:auto}
    #strip{height:auto;grid-template-columns:repeat(2,1fr);padding:8px}
    .imgwrap{aspect-ratio:4/3;flex:none}
  }
</style>
</head>

<script>
const BASE='https://cwwp2.dot.ca.gov/data/d3/cctv/image/';
const IW=1660, IH=920;            // pixel size of the embedded map image
// x,y = camera position in map-image pixels
const CAMS=[   // numbered west -> east; lab = where the name tag sits relative to the pin
  {n:1,name:'Wrights Lake (Kyburz)',  lat:38.786296,lon:-120.211154, x:252, y:815, slug:'hwy50atwrightslake2', c:'#c77dff',lab:'r'},
  {n:2,name:'Twin Bridges',           lat:38.811193,lon:-120.124303, x:756, y:630, slug:'hwy50attwinbridges',  c:'#3cb44b',lab:'t'},
  {n:3,name:'Sierra-at-Tahoe Rd EB',  lat:38.81914,lon:-120.07592, x:1038,y:571, slug:'hwy50atsierraeb',     c:'#4aa3ff',lab:'t'},
  {n:4,name:'Echo Summit',            lat:38.81321,lon:-120.02928, x:1310,y:615, slug:'hwy50atechosummit',   c:'#e6194b',lab:'r'},
  {n:5,name:'Meyers',                 lat:38.850899,lon:-120.022959, x:1347,y:332, slug:'hwy50atmeyers',       c:'#f58231',lab:'l'},
  {n:6,name:'Pioneer Trail EB',       lat:38.858153,lon:-120.011835, x:1411,y:279, slug:'pioneertrailed50eb1', c:'#2ec4b6',lab:'r'}
];
const $=id=>document.getElementById(id);
const wide=()=>!matchMedia('(max-width:820px)').matches;
const NS='http://www.w3.org/2000/svg';

function labelHTML(cam){   // name + current temperature (once loaded)
  const tp=cam.temp==null?'':' <b class="tmp" style="color:'+(cam.temp<=32?'#9ecbff':'#ffd8a8')+'">'+Math.round(cam.temp)+'&deg;F</b>';
  return cam.name+tp;   // (names are fixed text; esc() isn't defined yet when pins are first built)
}
function updateLabels(){
  CAMS.forEach(c=>{
    [c.pinStatic,c.marker&&c.marker.getElement()].forEach(el=>{const l=el&&el.querySelector('.lbl');if(l)l.innerHTML=labelHTML(c)});
  });
}
async function loadTemps(){       // current temperature at each camera location (Open-Meteo, elevation-adjusted)
  try{
    const j=await getJSON('https://api.open-meteo.com/v1/forecast?latitude='+CAMS.map(c=>c.lat).join(',')+'&longitude='+CAMS.map(c=>c.lon).join(',')+'&current=temperature_2m&temperature_unit=fahrenheit');
    const A=Array.isArray(j)?j:[j];
    CAMS.forEach((c,i)=>{const v=A[i]&&A[i].current&&A[i].current.temperature_2m;if(typeof v==='number')c.temp=v});
    updateLabels();
  }catch(e){}
}
function makePin(cam){
  const pin=document.createElement('div');
  pin.className='pin';pin.style.setProperty('--c',cam.c);pin.title=cam.name;
  pin.innerHTML=cam.n+'<span class="lbl '+cam.lab+'">'+labelHTML(cam)+'</span>';
  return pin;
}
CAMS.forEach(cam=>{
  cam.src=BASE+cam.slug+'/'+cam.slug+'.jpg';
  const card=document.createElement('div');
  card.className='card';card.style.setProperty('--c',cam.c);
  card.innerHTML='<header><span class="num">'+cam.n+'</span><span class="nm">'+cam.name+'</span><span class="st">...</span></header><div class="imgwrap"><img alt="'+cam.name+'"></div>';
  cam.card=card;cam.img=card.querySelector('img');cam.st=card.querySelector('.st');
  card.querySelector('.imgwrap').onclick=()=>{$('lbimg').src=cam.img.src;$('lbcap').textContent=cam.n+'. '+cam.name;$('lightbox').classList.add('on')};
  cam.img.onload=()=>{cam.st.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});cam.st.classList.remove('bad')};
  cam.img.onerror=()=>{cam.st.textContent='offline';cam.st.classList.add('bad')};
  $('strip').appendChild(card);                       // 1..6 left to right

  const pin=makePin(cam);
  pin.style.left=(cam.x/IW*100)+'%';pin.style.top=(cam.y/IH*100)+'%';
  $('mapimg').appendChild(pin);cam.pin=pin;cam.pinStatic=pin;

  const m=document.createElementNS(NS,'marker');
  m.setAttribute('id','ah'+cam.n);m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','9');m.setAttribute('refY','5');
  m.setAttribute('markerWidth','7');m.setAttribute('markerHeight','7');m.setAttribute('orient','auto-start-reverse');
  m.innerHTML='<path d="M0,0 L10,5 L0,10 z" fill="'+cam.c+'"/>';
  $('defs').appendChild(m);
  cam.path=document.createElementNS(NS,'path');
  cam.path.setAttribute('stroke',cam.c);cam.path.setAttribute('stroke-width','2.5');cam.path.setAttribute('fill','none');
  cam.path.setAttribute('marker-end','url(#ah'+cam.n+')');cam.path.setAttribute('opacity','.9');
  $('lines').appendChild(cam.path);
});

function drawLines(){
  const w=wide(), sr=$('stage').getBoundingClientRect();
  CAMS.forEach(cam=>{
    if(!w){cam.path.setAttribute('d','');return}
    const r=cam.card.getBoundingClientRect(), p=cam.pin.getBoundingClientRect();
    const sx=r.left+r.width/2-sr.left, sy=r.top-sr.top;            // top-center of the card
    const px=p.left+p.width/2-sr.left, py=p.top+p.height/2-sr.top;  // pin center
    const dx=px-sx, dy=py-sy, d=Math.hypot(dx,dy)||1;
    cam.path.setAttribute('d','M'+sx+','+sy+' L'+(px-dx/d*17)+','+(py-dy/d*17));
  });
}
function fit(){
  if(live&&gmap){gmap.resize();drawLines();return}
  const mi=$('mapimg'), mb=$('mapbox');
  if(wide()){
    const top=50, bw=mb.clientWidth, bh=mb.clientHeight-top;
    const s=Math.min(bw/IW,bh/IH), w=IW*s, h=IH*s;
    Object.assign(mi.style,{position:'absolute',width:w+'px',height:h+'px',left:(bw-w)/2+'px',top:(top+(bh-h)/2)+'px'});
  }else{
    Object.assign(mi.style,{position:'relative',width:'100%',height:'auto',left:'',top:''});
  }
  drawLines();
}
addEventListener('resize',fit);


/* ================= weather / road data ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getJSON=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const fail=(id,e)=>{$(id).innerHTML='<span class="muted">Unavailable right now ('+esc(e&&e.message||e)+').</span>'};

const WX_PTS=[
  {name:'Kyburz',            lat:38.786,lon:-120.211},
  {name:'Twin Bridges',      lat:38.811,lon:-120.124},
  {name:'Echo Summit',       lat:38.813,lon:-120.029},
  {name:'Meyers / S. Tahoe', lat:38.851,lon:-120.023}
];
const ROUTES=['US-50','SR-89'];

/*PARSERS*/
function laHourKey(){return new Date().toLocaleString('sv-SE',{timeZone:'America/Los_Angeles'}).slice(0,13).replace(' ','T')}
function parseOM(arr){
  const key=laHourKey();
  return (Array.isArray(arr)?arr:[arr]).map((o,i)=>{
    const h=o.hourly; let i0=h.time.findIndex(t=>t.startsWith(key)); if(i0<0)i0=0;
    const n=Math.min(24,h.time.length-i0), rows=[];
    for(let k=0;k<n;k++){const j=i0+k;rows.push({t:h.time[j],pop:h.precipitation_probability[j]||0,temp:h.temperature_2m[j],snow:h.snowfall[j]||0})}
    let snow72=0;for(let j=i0;j<Math.min(i0+72,h.time.length);j++)snow72+=h.snowfall[j]||0;
    const cold=r=>r.snow>0||r.temp<=34;
    return {name:WX_PTS[i].name,elev:Math.round((o.elevation||0)*3.281),rows,
      snow24:rows.reduce((a,r)=>a+r.snow,0),snow72,
      peak:Math.max(0,...rows.map(r=>r.pop)),
      snowPop:Math.max(0,...rows.filter(cold).map(r=>r.pop)),
      tmin:Math.min(...rows.map(r=>r.temp)),tmax:Math.max(...rows.map(r=>r.temp))};
  });
}
function verdict(p){
  if(p.snowPop>=60||p.snow24>=1)return ['Snow likely','#58a6ff'];
  if(p.snowPop>=30||p.snow24>=0.1)return ['Snow possible','#9ecbff'];
  if(p.peak>=40)return ['Rain possible','#3fb950'];
  return ['Mostly dry','#8b949e'];
}
function parseCC(j){
  return j.data.map(d=>d.cc).filter(c=>ROUTES.includes(c.location.route)&&String(c.inService)==='true')
    .map(c=>({route:c.location.route,name:c.location.locationName,dir:c.location.direction,st:c.statusData.status,desc:c.statusData.statusDescription}));
}
function parseLCS(j,now){
  return j.data.map(d=>d.lcs).filter(l=>ROUTES.includes(l.location.begin.beginRoute)).map(l=>{
    const c=l.closure,ts=c.closureTimestamp;
    return {route:l.location.begin.beginRoute,from:l.location.begin.beginLocationName,to:l.location.end.endLocationName,near:l.location.begin.beginNearbyPlace,
      type:c.typeOfClosure,work:c.typeOfWork,lanes:c.lanesClosed,total:c.totalExistingLanes,delay:c.estimatedDelay,
      s:+ts.closureStartEpoch,e:+ts.closureEndEpoch,indef:String(ts.isClosureEndIndefinite)==='true'};
  }).filter(x=>(x.s<=now&&(x.indef||x.e>=now))||(x.s>now&&x.s<now+12*3600))
    .filter((x,i,a)=>a.findIndex(y=>y.route===x.route&&y.from===x.from&&y.to===x.to&&y.type===x.type&&y.work===x.work)===i)
    .sort((a,b)=>((a.s>now)-(b.s>now))||((b.type==='Full')-(a.type==='Full'))||(a.s-b.s));
}
const fmtT=s=>new Date(s*1000).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});

async function loadOM(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+WX_PTS.map(p=>p.lat).join(',')+'&longitude='+WX_PTS.map(p=>p.lon).join(',')
      +'&hourly=temperature_2m,precipitation_probability,snowfall&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FLos_Angeles&forecast_days=4';
    const P=parseOM(await getJSON(u));
    $('om').innerHTML=P.map(p=>{
      const v=verdict(p);
      const bars=p.rows.map(r=>{
        const col=(r.snow>0||r.temp<=34)?'#58a6ff':'#3fb950';
        const h=r.pop>0?Math.max(6,r.pop):3;
        const d=new Date(r.t);
        return '<i style="height:'+h+'%;background:'+(r.pop>0?col:'#30363d')+'" title="'+esc(d.toLocaleString([], {weekday:'short',hour:'numeric'}))+': '+r.pop+'% · '+Math.round(r.temp)+'°F'+(r.snow>0?' · '+r.snow.toFixed(2)+' in snow':'')+'"></i>';
      }).join('');
      return '<div class="loc"><div class="lh"><b>'+esc(p.name)+' <span class="muted" style="font-weight:400">'+p.elev.toLocaleString()+' ft</span></b><span class="chip" style="background:'+v[1]+'">'+v[0]+'</span></div>'
        +'<div class="mets"><span>&#10052; <b>'+p.snow24.toFixed(1)+'&Prime;</b> / 24 h</span><span>'+p.snow72.toFixed(1)+'&Prime; / 72 h</span><span>Snow chance <b>'+p.snowPop+'%</b></span><span>'+Math.round(p.tmin)+'&ndash;'+Math.round(p.tmax)+'&deg;F</span></div>'
        +'<div class="strip24">'+bars+'</div><div class="ticks"><span>now</span><span>+12 h</span><span>+24 h</span></div></div>';
    }).join('')+'<div class="legend"><span><i style="background:#58a6ff"></i>snow-temp hours (&le;34&deg;F)</span><span><i style="background:#3fb950"></i>rain-temp</span><span>bar = precip chance</span></div>';
  }catch(e){fail('om',e)}
}
async function loadAlerts(){
  try{
    const a=await getJSON('https://api.weather.gov/alerts/active?point=38.813,-120.029');
    const F=(a.features||[]).map(x=>x.properties);
    $('alerts').innerHTML=F.length?F.map(p=>'<div class="alert"><b>'+esc(p.event)+'</b> &mdash; '+esc(p.headline||'')+'</div>').join(''):'';
  }catch(e){$('alerts').innerHTML=''}
}
async function loadCC(){
  try{
    const R=parseCC(await getJSON('https://cwwp2.dot.ca.gov/data/d3/cc/ccStatusD03.json'));
    const on=R.filter(r=>r.st&&r.st!=='R-0'&&r.st!=='NONE');
    if(!on.length){$('cc').innerHTML='<div class="ok" style="margin:0">No chain controls in effect on US-50 / SR-89 ('+R.length+' stations reporting).</div>';return}
    const col={'R-1':'#d29922','R-2':'#db6d28','R-3':'#f85149'};
    $('cc').innerHTML='<table class="t">'+on.map(r=>'<tr><td><span class="badge" style="background:'+(col[r.st]||'#d29922')+'">'+esc(r.st)+'</span></td><td><b>'+esc(r.route)+'</b> '+esc(r.dir)+' &middot; '+esc(r.name)+'<br><span class="muted">'+esc(r.desc)+'</span></td></tr>').join('')+'</table>';
  }catch(e){fail('cc',e)}
}
/* ---- drive time ----
   Live ETA = Mapbox Directions "driving-traffic" (uses Mapbox's live traffic), loaded on page load and every 2 minutes.
   Google / Apple / Waze don't let a web page read their ETAs, so those three are one-tap links that open each app's own live ETA. */
const PL={
  home:{label:'3485 April Dr',sub:'S. Lake Tahoe',addr:'3485+April+Dr,+South+Lake+Tahoe,+CA+96150',q:'3485%20April%20Dr%20South%20Lake%20Tahoe%20CA',lon:-119.9531,lat:38.9278},
  rock:{label:'3306 Cameo Ct',sub:'Rocklin',      addr:'3306+Cameo+Ct,+Rocklin,+CA+95765',          q:'3306%20Cameo%20Ct%20Rocklin%20CA',          lon:-121.2646,lat:38.7873}
};
let flipped=false;                                   // false: Tahoe -> Rocklin, true: Rocklin -> Tahoe
const FROM=()=>flipped?PL.rock:PL.home, TO=()=>flipped?PL.home:PL.rock;
const APPS=[
  {app:'Google',c:'#4285f4',icon:'pin',   url:()=>'https://www.google.com/maps/dir/?api=1&origin='+FROM().addr+'&destination='+TO().addr+'&travelmode=driving'},
  {app:'Apple', c:'#34a853',icon:'arrow', url:()=>'https://maps.apple.com/?saddr='+FROM().addr+'&daddr='+TO().addr+'&dirflg=d'},
  {app:'Waze',  c:'#12a9d6',icon:'bubble',url:()=>'https://www.waze.com/ul?q='+TO().q+'&navigate=yes'}
];
const ICONS={
  pin:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2L4.5 21l7.5-4.2 7.5 4.2z"/></svg>',
  bubble:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3C7 3 3 6.6 3 11c0 2.2 1 4.2 2.6 5.6L5 21l4.2-2c.9.2 1.8.3 2.8.3 5 0 9-3.6 9-8S17 3 12 3zM9 10.5a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm6 0a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>',
  car:'<svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11a2 2 0 0 1 2 2v4h-2v2h-3v-2H8v2H5v-2H3v-4a2 2 0 0 1 2-2zm2.1 0h9.8l-1-3H8.1l-1 3zM6.5 14a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm11 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>'
};
let ETA=null;       // null = loading; {kind:'live'|'typical'|'none', routes:[{dur,typ,mi,via}], at}
const fmtDur=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' hr '+(m%60)+' min':m+' min'};
const fmtClock=ms=>new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
function renderHead(){const f=FROM(),o=TO();$('drt').innerHTML='<b>'+f.label+'</b>, '+f.sub+' &rarr; <b>'+o.label+'</b>, '+o.sub}
function renderDrive(){
  renderHead();
  let main;
  if(!ETA){
    main='<div class="dc" style="--c:#6e7681"><div class="ic">'+ICONS.car+'</div><div class="mid"><div class="app">Live now</div><div class="rn">Loading current drive time&hellip;</div></div></div>';
  }else if(ETA.kind==='none'){
    main='<div class="dc" style="--c:#6e7681"><div class="ic">'+ICONS.car+'</div><div class="mid"><div class="app">Drive time</div><div class="rn">Estimate unavailable</div><div class="nt">Use the app buttons below for a live ETA.</div></div></div>';
  }else{
    const r=ETA.routes[0], live=ETA.kind==='live';
    const diff=(live&&r.typ)?Math.round((r.dur-r.typ)/60):0;
    const col=!live?'#8b949e':diff<=5?'#3fb950':diff<=15?'#d29922':'#f85149';
    const note=live?(r.typ?(diff<=5?'About normal':'+'+diff+' min vs typical')+' ('+fmtDur(r.typ)+') &middot; arrive '+fmtClock(ETA.at+r.dur*1000):'arrive '+fmtClock(ETA.at+r.dur*1000)):'typical drive, no traffic &middot; live traffic unavailable';
    main='<div class="dc" style="--c:'+col+'"><div class="ic">'+ICONS.car+'</div><div class="mid"><div class="app">'+(live?'Live now &middot; Mapbox traffic':'Typical')+'</div>'
      +'<div class="rn">'+(r.via?'via '+esc(r.via):'Fastest route')+'</div><div class="nt">'+note+'</div><div class="asof">updated '+fmtClock(ETA.at)+'</div></div>'
      +'<div class="rg"><div class="tm" style="color:'+col+'">'+fmtDur(r.dur)+'</div><div class="mi">'+r.mi.toFixed(0)+' mi</div></div></div>'
      +ETA.routes.slice(1,3).map(a=>'<div class="alt">Also: <b>'+(a.via?esc(a.via):'another route')+'</b> &middot; '+fmtDur(a.dur)+' &middot; '+a.mi.toFixed(0)+' mi</div>').join('');
  }
  const apps='<div class="apps">'+APPS.map(a=>'<a href="'+esc(a.url())+'" target="_blank" rel="noopener"><span class="ai" style="background:'+a.c+'">'+ICONS[a.icon]+'</span>'+esc(a.app)+' &#8599;</a>').join('')+'</div><div class="apsub">Tap an app for its own live ETA</div>';
  $('dcards').innerHTML=main+apps;
}
async function loadDrive(){
  try{
    const tok=MAPBOX_TOKEN||getTok();
    if(!tok)throw new Error('no token');
    const f=FROM(),o=TO();
    const j=await getJSON('https://api.mapbox.com/directions/v5/mapbox/driving-traffic/'+f.lon+','+f.lat+';'+o.lon+','+o.lat+'?alternatives=true&overview=false&access_token='+encodeURIComponent(tok));
    if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error(j.code||'no route');
    ETA={kind:'live',at:Date.now(),routes:j.routes.slice(0,3).map(r=>({dur:r.duration,typ:r.duration_typical,mi:r.distance/1609.34,via:(r.legs&&r.legs[0]&&r.legs[0].summary)||''}))};
  }catch(e){
    try{    // fallback: free OSRM, typical time only
      const f=FROM(),o=TO();
      const j=await getJSON('https://router.project-osrm.org/route/v1/driving/'+f.lon+','+f.lat+';'+o.lon+','+o.lat+'?overview=false');
      ETA={kind:'typical',at:Date.now(),routes:[{dur:j.routes[0].duration,mi:j.routes[0].distance/1609.34,via:''}]};
    }catch(e2){ETA={kind:'none',at:Date.now(),routes:[]}}
  }
  renderDrive();
}
function loadWx(){
  loadDrive();loadTemps();
  Promise.all([loadOM(),loadAlerts(),loadCC()]).then(()=>{$('wxupd').textContent='Weather & road data updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' (auto-refresh every 10 min)'});
}


/* ================= live Mapbox map (optional) =================
   Needs a free *public* Mapbox token (starts with pk.). Paste it below, or paste it into the box on the page
   (it is remembered in this browser). Without a token the page shows the static screenshot map. */
const MAPBOX_TOKEN='pk.eyJ1IjoiY2FsZS1zaW1tb25zIiwiYSI6ImNtd3U2eGRuNTA5MDEyenExM2NqbWpyZ3MifQ.zYYrIXeEO62_sWYpGLLgxg';
const STYLES={outdoors:'mapbox://styles/mapbox/outdoors-v12',streets:'mapbox://styles/mapbox/streets-v12',satellite:'mapbox://styles/mapbox/satellite-streets-v12'};
let gmap=null, live=false, trafficOn=true, curStyle='outdoors';
const getTok=()=>{try{return MAPBOX_TOKEN||localStorage.getItem('mbx_token')||''}catch(e){return MAPBOX_TOKEN}};
const setTok=v=>{try{v?localStorage.setItem('mbx_token',v):localStorage.removeItem('mbx_token')}catch(e){}};

function showTok(msg){
  $('tokbox').innerHTML='<b>Live traffic map (Mapbox)</b> &mdash; paste your free public token (starts with <code>pk.</code>). Get one at <a href="https://account.mapbox.com/access-tokens/" target="_blank" rel="noopener">account.mapbox.com</a>.'
    +'<div class="tr"><input id="tokin" placeholder="pk.eyJ1..." autocomplete="off" spellcheck="false"><button id="toksave">Save</button></div>'
    +(msg?'<div class="err">'+esc(msg)+'</div>':'');
  $('tokbox').classList.add('on');
  $('toksave').onclick=()=>{const v=$('tokin').value.trim();if(!/^pk\./.test(v)){showTok('That doesn\u2019t look like a public token \u2014 it should start with pk.');return}setTok(v);stopLive();startLive()};
}
const hideTok=()=>$('tokbox').classList.remove('on');

/* ---- precipitation radar (RainViewer, free, no key) ---- */
let radarOn=true, radarHost='', radarFrame=null, radarStamp=0;
const radarURL=()=>radarHost&&radarFrame?radarHost+radarFrame.path+'/512/{z}/{x}/{y}/4/1_1.png':null;
function setRadarBtn(txt){
  $('radarbtn').classList.toggle('on',radarOn&&!!radarFrame);
  $('radartime').innerHTML=txt!=null?'&middot; '+txt:(radarFrame?'&middot; '+new Date(radarFrame.time*1000).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'');
}
function addRadar(){
  const url=radarURL(); if(!gmap||!url)return;
  if(!gmap.getSource('rv-radar'))gmap.addSource('rv-radar',{type:'raster',tiles:[url],tileSize:512,maxzoom:7,attribution:'Radar &copy; <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>'});
  if(gmap.getLayer('rv-radar'))return;
  const firstSymbol=(gmap.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
  gmap.addLayer({id:'rv-radar',type:'raster',source:'rv-radar',
    layout:{visibility:radarOn?'visible':'none'},
    paint:{'raster-opacity':.62,'raster-fade-duration':300}},firstSymbol);
}
async function fetchRadar(){              // newest radar frame; refreshed every 5 min
  try{
    const j=await getJSON('https://api.rainviewer.com/public/weather-maps.json');
    const past=(j.radar&&j.radar.past)||[];
    if(!past.length)throw new Error('no frames');
    radarHost=j.host; radarFrame=past[past.length-1]; radarStamp=Date.now();
    if(gmap&&live){
      const src=gmap.getSource('rv-radar');
      if(src&&src.setTiles)src.setTiles([radarURL()]);
      else if(gmap.getLayer('rv-radar')){gmap.removeLayer('rv-radar');gmap.removeSource('rv-radar');addRadar()}
      else addRadar();
    }
    setRadarBtn();
  }catch(e){ if(!radarFrame)setRadarBtn('unavailable'); }
}
$('radarbtn').onclick=()=>{
  radarOn=!radarOn;
  if(gmap&&gmap.getLayer('rv-radar'))gmap.setLayoutProperty('rv-radar','visibility',radarOn?'visible':'none');
  setRadarBtn(radarOn?null:'off');
};

function addTraffic(){
  if(!gmap.getSource('mbx-traffic'))gmap.addSource('mbx-traffic',{type:'vector',url:'mapbox://mapbox.mapbox-traffic-v1'});
  if(gmap.getLayer('mbx-traffic'))return;
  const firstSymbol=(gmap.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
  gmap.addLayer({id:'mbx-traffic',type:'line',source:'mbx-traffic','source-layer':'traffic',minzoom:6,
    layout:{'line-join':'round','line-cap':'round',visibility:trafficOn?'visible':'none'},
    paint:{'line-width':['interpolate',['linear'],['zoom'],8,1.5,12,3.5,15,7],
           'line-color':['match',['get','congestion'],'low','#2ecc71','moderate','#f1c40f','heavy','#e67e22','severe','#e74c3c','#8b949e'],
           'line-opacity':.95}},firstSymbol);
}
let trafficStamp=0;
function reloadTraffic(){            // re-fetch the live traffic tiles
  if(!gmap||!live)return;
  trafficStamp=Date.now();
  try{
    if(gmap.getLayer('mbx-traffic'))gmap.removeLayer('mbx-traffic');
    if(gmap.getSource('mbx-traffic'))gmap.removeSource('mbx-traffic');
    addTraffic();
  }catch(e){}
}
function stopLive(){
  live=false;
  CAMS.forEach(c=>{if(c.marker){c.marker.remove();c.marker=null}c.pin=c.pinStatic});
  if(gmap){gmap.remove();gmap=null}
  $('gl').style.display='none';$('mapimg').style.display='';$('goTraffic').style.display='';$('radarbtn').classList.remove('show');
  fit();
}
function startLive(){
  const tok=getTok();
  if(!tok){showTok('');return}
  if(!window.mapboxgl){showTok('The Mapbox library could not load (offline, or this viewer blocks it). Showing the static map.');return}
  if(mapboxgl.supported&&!mapboxgl.supported()){showTok('This viewer cannot draw WebGL maps. Open the file in Chrome or Safari.');return}
  hideTok();
  mapboxgl.accessToken=tok;
  $('gl').style.display='block';
  const DEFAULT_VIEW=[[-120.236,38.768],[-119.985,38.885]]; // SW..NE -- Wrights Lake to Pioneer Trail/Meyers, lake excluded
  gmap=new mapboxgl.Map({container:'gl',style:STYLES[curStyle],bounds:DEFAULT_VIEW,fitBoundsOptions:{padding:{top:60,bottom:50,left:50,right:50}},attributionControl:true});
  gmap.addControl(new mapboxgl.NavigationControl({showCompass:false}),'top-right');
  gmap.on('style.load',()=>{addRadar();addTraffic()});
  gmap.on('load',()=>{
    live=true;trafficStamp=Date.now();$('mapimg').style.display='none';$('goTraffic').style.display='none';
    $('radarbtn').classList.add('show');addRadar();setRadarBtn(radarFrame?null:'loading');
    CAMS.forEach(c=>{const el=makePin(c);el.classList.add('live');c.marker=new mapboxgl.Marker({element:el}).setLngLat([c.lon,c.lat]).addTo(gmap);c.pin=el});
    drawLines();
  });
  gmap.on('move',drawLines);
  gmap.on('moveend',()=>{if(live&&Date.now()-trafficStamp>15000)reloadTraffic()});   // refresh traffic after every pan/zoom (max once per 15 s)
  gmap.on('error',e=>{
    if(live)return;                       // ignore stray tile errors once the map is up
    const m=(e&&e.error&&e.error.message)||'unknown error';
    stopLive();showTok('Mapbox could not load the map ('+m+'). Check the token, then Save again.');
  });
}
// "Click for traffic": copy the token to the clipboard, paste it into the token box, save it, and start the live map
$('goTraffic').onclick=async()=>{
  const tok=MAPBOX_TOKEN||getTok();
  try{await navigator.clipboard.writeText(tok)}catch(e){}
  showTok('');
  const inp=$('tokin'); if(inp)inp.value=tok;
  setTok(tok);
  stopLive();
  if(inp&&$('tokbox').classList.contains('on'))inp.value=tok;
  startLive();
};

function loadAll(){CAMS.forEach(c=>{c.img.src=c.src+'?t='+Date.now()});loadWx()}
$('lightbox').onclick=()=>$('lightbox').classList.remove('on');
setInterval(()=>CAMS.forEach(c=>{c.img.src=c.src+'?t='+Date.now()}),5000);   // cameras refresh every 5 s
setInterval(loadWx,600000);
setInterval(loadDrive,120000);
fetchRadar();setInterval(fetchRadar,300000);
$('swap').onclick=()=>{flipped=!flipped;ETA=null;renderDrive();loadDrive()};   // flip start <-> destination
renderDrive();loadAll();fit();startLive();
setTimeout(fit,300);
if(window.ResizeObserver)new ResizeObserver(fit).observe($('mapbox'));
</script>
