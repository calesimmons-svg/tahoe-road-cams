<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17497a"/>
      <stop offset="50%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#5fb2ff"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="32" cy="32" r="31"/>
    </clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <!-- lake/sky base -->
    <circle cx="32" cy="32" r="31" fill="url(#lake)"/>

    <!-- mountain range -->
    <path d="M-4,42 L10,24 L20,34 L32,18 L44,34 L54,24 L68,42 L68,68 L-4,68 Z" fill="#0a2742"/>

    <!-- snow caps -->
    <path d="M10,24 L15,30 L5,31 Z" fill="#eef7ff"/>
    <path d="M32,18 L38,25 L26,26 Z" fill="#eef7ff"/>
    <path d="M54,24 L59,30 L49,31 Z" fill="#eef7ff"/>

    <!-- water shimmer -->
    <ellipse cx="21" cy="50" rx="9" ry="1.6" fill="#eaf6ff" opacity="0.55"/>
    <ellipse cx="42" cy="55" rx="12" ry="1.8" fill="#eaf6ff" opacity="0.4"/>
  </g>

  <!-- outer ring -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#071726" stroke-width="2"/>
</svg>
